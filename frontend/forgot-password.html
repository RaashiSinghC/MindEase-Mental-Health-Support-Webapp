<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MindEase</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 2rem 0;
        }
        .auth-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-title {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-full {
            width: 100%;
            padding: 0.8rem;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .message.success {
            background: #e8f5e8;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .message.error {
            background: #ffeaea;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .message.info {
            background: #e6f2ff;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-icon">🧠</span>
                <span>MindEase</span>
            </a>
            <div class="nav-buttons">
                <a href="login.html" class="btn btn-outline">Back to Login</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Reset Your Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
            </div>

            <div id="messageContainer"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="your.email@example.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html" class="auth-link">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageContainer = document.getElementById('messageContainer');
            
            try {
                const response = await fetch('http://localhost:5000/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();
                
                if (response.ok) {
                    messageContainer.innerHTML = `
                        <div class="message success">
                            <strong>Check your email!</strong><br>
                            ${data.message}
                            ${data.reset_token ? `<br><br><strong>Test Token:</strong> ${data.reset_token}` : ''}
                        </div>
                    `;
                    
                    // Clear form
                    document.getElementById('forgotPasswordForm').reset();
                    
                    // Show link to reset page for testing
                    if (data.reset_token) {
                        setTimeout(() => {
                            messageContainer.innerHTML += `
                                <div class="message info">
                                    <strong>Testing:</strong> 
                                    <a href="reset-password.html?token=${data.reset_token}" style="color: var(--primary);">
                                        Click here to reset password
                                    </a>
                                </div>
                            `;
                        }, 1000);
                    }
                } else {
                    messageContainer.innerHTML = `
                        <div class="message error">
                            ${data.message || 'Failed to send reset link'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                messageContainer.innerHTML = `
                    <div class="message error">
                        Network error. Please try again.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
