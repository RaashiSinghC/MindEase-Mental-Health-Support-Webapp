<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MindEase</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 2rem 0;
        }
        .auth-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-title {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-full {
            width: 100%;
            padding: 0.8rem;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .message.success {
            background: #e8f5e8;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .message.error {
            background: #ffeaea;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .token-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-icon">🧠</span>
                <span>MindEase</span>
            </a>
            <div class="nav-buttons">
                <a href="login.html" class="btn btn-outline">Back to Login</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Create New Password</h1>
                <p>Enter your new password below</p>
            </div>

            <div id="messageContainer"></div>
            <div id="tokenInfo" class="token-info" style="display: none;">
                Reset token loaded
            </div>

            <form id="resetPasswordForm">
                <input type="hidden" id="resetToken">
                
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html" class="auth-link">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            document.getElementById('resetToken').value = token;
            document.getElementById('tokenInfo').style.display = 'block';
            
            // Validate token on page load
            validateResetToken(token);
        } else {
            document.getElementById('messageContainer').innerHTML = `
                <div class="message error">
                    Invalid reset link. Please request a new password reset.
                </div>
            `;
            document.getElementById('resetPasswordForm').style.display = 'none';
        }

        async function validateResetToken(token) {
            try {
                const response = await fetch('http://localhost:5000/api/validate-reset-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token })
                });

                const data = await response.json();
                
                if (!data.valid) {
                    document.getElementById('messageContainer').innerHTML = `
                        <div class="message error">
                            ${data.message || 'Invalid or expired reset token'}
                        </div>
                    `;
                    document.getElementById('resetPasswordForm').style.display = 'none';
                }
            } catch (error) {
                console.error('Token validation error:', error);
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageContainer = document.getElementById('messageContainer');
            
            if (newPassword !== confirmPassword) {
                messageContainer.innerHTML = `
                    <div class="message error">
                        Passwords do not match
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    messageContainer.innerHTML = `
                        <div class="message success">
                            ${data.message}
                        </div>
                    `;
                    
                    document.getElementById('resetPasswordForm').style.display = 'none';
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    messageContainer.innerHTML = `
                        <div class="message error">
                            ${data.message || 'Failed to reset password'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                messageContainer.innerHTML = `
                    <div class="message error">
                        Network error. Please try again.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
