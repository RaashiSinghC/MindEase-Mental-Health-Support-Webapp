<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Therapist - MindEase</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            border-radius: 10px 10px 0 0;
            text-align: center;
            position: relative;
        }
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 70%;
            padding: 0.8rem 1rem;
            border-radius: 15px;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            align-self: flex-start;
            background: #f1f3f5;
            color: var(--text);
            border-bottom-left-radius: 5px;
        }
        .chat-input {
            display: flex;
            padding: 1rem;
            border-top: 1px solid #eee;
            gap: 0.5rem;
        }
        .chat-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }
        .chat-input button {
            padding: 0.8rem 1.5rem;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }
        .typing-indicator {
            align-self: flex-start;
            background: #f1f3f5;
            padding: 0.8rem 1rem;
            border-radius: 15px;
            border-bottom-left-radius: 5px;
            color: #666;
            font-style: italic;
        }
        .timestamp {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.3rem;
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid #eee;
            background: #f8f9fa;
        }
        .quick-reply {
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .quick-reply:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .chat-actions {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="dashboard.html" class="logo">
                <span class="logo-icon">🧠</span>
                <span>MindEase</span>
            </a>
            <div class="nav-buttons">
                <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </nav>
    </header>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 MindEase AI Therapist</h2>
            <p>I'm here to listen and support you 24/7</p>
            <div class="chat-actions">
                <button class="action-btn" onclick="clearChat()" title="Clear chat">🗑️</button>
                <button class="action-btn" onclick="showQuickReplies()" title="Quick replies">💬</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Hello! I'm your MindEase assistant. I'm here to listen and provide support. How are you feeling today?
                <div class="timestamp">Just now</div>
            </div>
        </div>
        
        <div class="quick-replies" id="quickReplies">
            <div class="quick-reply" onclick="sendQuickReply('I feel sad today')">😢 I feel sad</div>
            <div class="quick-reply" onclick="sendQuickReply('I am feeling anxious')">😰 I'm anxious</div>
            <div class="quick-reply" onclick="sendQuickReply('I am stressed out')">😫 I'm stressed</div>
            <div class="quick-reply" onclick="sendQuickReply('I feel happy today')">😊 I feel happy</div>
            <div class="quick-reply" onclick="sendQuickReply('I need help coping')">🆘 I need help</div>
            <div class="quick-reply" onclick="sendQuickReply('I feel lonely')">😔 I feel lonely</div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
